---
- name: Перезагрузка zabbix и apache2
  ansible.builtin.systemd:
    name: "{{ item }}"    # Специальная переменная цикла loop. Она принимает значение текущего элемента по очереди из списка
    state: restarted
  loop:                   # Цикл loop
    - zabbix-server
    - zabbix-agent
    - apache2