---
- name: Установка nginx и node_exporter на webservers
  hosts: webservers
  become: true
  roles:
    - nginx
    - node_exporter
    - nginx_exporter_log

- name: Установка Prometheus
  hosts: prometheus
  become: true
  roles:
    - prometheus

- name: Установка Grafana
  hosts: grafana
  become: true
  roles:
    - grafana
    - grafana_config


- name: Установить Elasticsearch ключи
  hosts: all
  become: true
  roles:
    - elasticsearch_keys


- name: Установка filebeat
  hosts: webservers
  become: true
  roles:
    - filebeat


- name: Установить Elasticsearch
  hosts: elasticsearch
  become: true
  roles:
    - elasticsearch

- name: Установка kibana
  hosts: kibana
  become: true
  roles:
    - kibana

