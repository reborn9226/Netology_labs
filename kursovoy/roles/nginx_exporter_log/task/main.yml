---

- name: Создаем директорию install для  prometheus-nginxlog-exporter
  file:
    path: /tmp/install/
    state: directory

- name: Скачиваем пакет prometheus-nginxlog-exporter
  get_url:
    url: https://github.com/martin-helmich/prometheus-nginxlog-exporter/releases/download/v1.9.2/prometheus-nginxlog-exporter_1.9.2_linux_amd64.deb
    dest: /tmp/install/
    force: no

- name: Установка репозитория
  apt:
    deb: /tmp/install/prometheus-nginxlog-exporter_1.9.2_linux_amd64.deb

- name: Запуск службы nginxlog-exporter
  systemd:
    name: prometheus-nginxlog-exporter
    enabled: yes
    state: started