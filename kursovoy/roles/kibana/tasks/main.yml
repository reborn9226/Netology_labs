- name: Установить kibana
  ansible.builtin.apt:
    name: "kibana={{ elastic_stack_version }}"
    state: present
    update_cache: true
  async: 3600                          # Разрешаем задаче выполнятся до 3600 секунд
  poll: 15                             # проверять задачу каждые 15 секунд
  no_log: true

- name: Включить автозапуск и запустить kibana
  ansible.builtin.systemd_service:
    name: kibana.service
    daemon_reload: true
    enabled: true
    state: started

- name: Разместить доверенный CA Elasticsearch для Kibana
  ansible.builtin.copy:
    src: "{{ elastic_cert_dir }}/http_ca.crt"
    dest: /etc/kibana/http_ca.crt
    owner: root
    group: kibana
    mode: "0640"
  notify: restart Kibana


