---
- name: Установка пакетов
  apt:
    name:
    - adduser
    - libfontconfig1
    - musl
    state: present
    update_cache: yes

- name: Создаем директорию install
  file:
    path: /tmp/install/
    state: directory

- name: Скачать Grafana 12.4.1 с зеркала Яндекса
  ansible.builtin.get_url:
    url: "https://mirror.yandex.ru/mirrors/packages.grafana.com/oss/deb/pool/main/g/grafana/grafana_12.4.1_22846628243_linux_amd64.deb"
    dest: /tmp/install/grafana_12.4.1_22846628243_linux_amd64.deb
    checksum: "sha256:df11e0659c5f608cdaf9713db66c9db5b869106f44d3bfd87bbfa5e2d2b18c68"
    owner: root
    group: root
    mode: "0644"
    timeout: 120


- name: Установка Grafana
  apt:
    deb: /tmp/install/grafana_12.4.1_22846628243_linux_amd64.deb
    state: present

- name: Запуск службы Grafana
  systemd:
    name: grafana-server.service
    enabled: yes
    state: started

