---
# Общая версия Elasticsearch, Kibana и Filebeat.
elastic_stack_version: "8.19.23"              # Версия ELK
elastic_cert_dir: "{{ playbook_dir }}/cert"   # В корне папка для хранения сертификатов
# Адрес elasticsearch
elasticsearch_url: >-
  https://{{ hostvars[groups['elasticsearch'][0]]['ansible_host'] }}:9200
# Адрес kibana
kibana_url: >-
  http://{{ hostvars[groups['kibana'][0]]['ansible_host'] }}:5601
