---
- name: Создаем директорию http1 и http2
  file:
    path: /home/vagrant/{http1,http2}   # путь к директории, которую нужно создать
    state: directory

- name: Создаем файл index.html в директории http1
  copy:
    content: "Server 1 :8888"
    dest: /home/vagrant/http1/index.htm


- name: Создаем файл index.html в директории http2
  copy:
    content: "Server 2 :9999"
    dest: /home/vagrant/http2/index.htm

- name: Запускаем севрвер на порту 8888
  shell: "python3 -m http.server 8888 --directory /home/vagrant/http1/ --bind 0.0.0.0"

- name: Запускаем сервер на порту 9999
  shell: "python3 -m http.server 9999 --directory /home/vagrant/http2/ --bind 0.0.0.0"

- name: Проверка работы серверов
  uri:
    url: "http://localhost:{{ item }}"
    with_items:
      - 8888
      - 9999

